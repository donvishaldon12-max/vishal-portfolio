<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast Dashboard | Vishal Prajapati</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #38bdf8;
            --border-color: #334155;
            --glow-color: rgba(56, 189, 248, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .dashboard-container {
            width: 100%;
            max-width: 900px;
            margin-top: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-bottom: 8px;
            text-shadow: 0 0 15px var(--glow-color);
        }

        /* Search Section */
        .search-box {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .search-input {
            width: 60%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .search-btn {
            padding: 12px 25px;
            border-radius: 25px;
            border: none;
            background-color: var(--primary-color);
            color: #0f172a;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 15px var(--glow-color);
        }

        /* Main Weather Card */
        .weather-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .weather-card:hover {
            box-shadow: 0 0 25px var(--glow-color);
        }

        .weather-info h2 {
            font-size: 2rem;
            margin: 0;
        }

        .temp {
            font-size: 3.5rem;
            font-weight: bold;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
            color: var(--text-muted);
        }

        .weather-icon-box {
            text-align: center;
        }

        .weather-icon {
            font-size: 5rem;
        }

        .weather-desc {
            font-size: 1.2rem;
            text-transform: capitalize;
            color: var(--text-muted);
        }

        /* 5-Day Forecast Grid */
        .forecast-title {
            font-size: 1.5rem;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
        }

        .forecast-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.3s;
        }

        .forecast-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-color);
            box-shadow: 0 0 15px var(--glow-color);
        }

        .forecast-day {
            font-weight: bold;
            margin-bottom: 10px;
        }

        .forecast-temp {
            font-size: 1.2rem;
            color: var(--primary-color);
            font-weight: bold;
            margin: 10px 0;
        }

        .back-link {
            display: inline-block;
            margin-top: 30px;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: bold;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <div class="header">
            <h1>Weather Forecast Dashboard</h1>
            <p style="color: var(--text-muted);">Real-time weather data and forecasts</p>
        </div>

        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" id="city-input" class="search-input" placeholder="Enter city name..." value="Delhi">
            <button id="search-btn" class="search-btn">Search</button>
        </div>

        <!-- Current Weather Display -->
        <div class="weather-card">
            <div class="weather-info">
                <h2 id="city-name">Delhi, IN</h2>
                <div class="temp" id="temperature">28°C</div>
                <div class="details-grid">
                    <div>Humidity: <span id="humidity" style="color: var(--text-main);">65%</span></div>
                    <div>Wind: <span id="wind" style="color: var(--text-main);">12 km/h</span></div>
                    <div>Pressure: <span id="pressure" style="color: var(--text-main);">1012 hPa</span></div>
                    <div>Visibility: <span id="visibility" style="color: var(--text-main);">10 km</span></div>
                </div>
            </div>
            <div class="weather-icon-box">
                <div class="weather-icon" id="weather-icon">☀️</div>
                <div class="weather-desc" id="weather-condition">Clear Sky</div>
            </div>
        </div>

        <!-- 5-Day Forecast -->
        <h3 class="forecast-title">5-Day Forecast</h3>
        <div class="forecast-grid" id="forecast-grid">
            <!-- Dynamic Forecast Items populated by JS -->
        </div>

        <div style="text-align: center;">
            <a href="myportfolio.html" class="back-link">&larr; Back to Portfolio</a>
        </div>
    </div>

    <script>
        // Sample static weather generator (Replaces API Key requirement out of the box)
        const weatherIcons = {
            Clear: '☀️',
            Clouds: '☁️',
            Rain: '🌧️',
            Thunderstorm: '🌩️',
            Snow: '❄️',
            Mist: '🌫️'
        };

        const searchBtn = document.getElementById('search-btn');
        const cityInput = document.getElementById('city-input');

        function updateWeather(city) {
            // Simulated real-time calculation based on city name
            const hash = city.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const temp = 15 + (hash % 20);
            const humidity = 40 + (hash % 50);
            const wind = 5 + (hash % 20);
            const conditions = ['Clear', 'Clouds', 'Rain', 'Thunderstorm'];
            const condition = conditions[hash % conditions.length];

            // Update UI
            document.getElementById('city-name').textContent = city.toUpperCase();
            document.getElementById('temperature').textContent = `${temp}°C`;
            document.getElementById('humidity').textContent = `${humidity}%`;
            document.getElementById('wind').textContent = `${wind} km/h`;
            document.getElementById('weather-condition').textContent = condition;
            document.getElementById('weather-icon').textContent = weatherIcons[condition] || '☀️';

            generateForecast(temp, condition);
        }

        function generateForecast(baseTemp, baseCondition) {
            const forecastGrid = document.getElementById('forecast-grid');
            forecastGrid.innerHTML = '';
            
            const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
            const todayIndex = new Date().getDay();

            for (let i = 1; i <= 5; i++) {
                const dayName = days[(todayIndex + i) % 7];
                const dayTemp = baseTemp + (i % 2 === 0 ? i : -i);
                
                const card = document.createElement('div');
                card.className = 'forecast-card';
                card.innerHTML = `
                    <div class="forecast-day">${dayName}</div>
                    <div style="font-size: 2rem;">${weatherIcons[baseCondition]}</div>
                    <div class="forecast-temp">${dayTemp}°C</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">${baseCondition}</div>
                `;
                forecastGrid.appendChild(card);
            }
        }

        searchBtn.addEventListener('click', () => {
            if (cityInput.value.trim() !== '') {
                updateWeather(cityInput.value.trim());
            }
        });

        cityInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && cityInput.value.trim() !== '') {
                updateWeather(cityInput.value.trim());
            }
        });

        // Initialize with default city
        updateWeather('Delhi');
    </script>
</body>
</html>
